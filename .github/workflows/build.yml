name: Profil-SVGs aktualisieren
on:
  push:
    branches: [main]
    paths-ignore: ["dark_mode.svg", "light_mode.svg", "cache/**"]
  schedule:
    - cron: "0 4 * * *"   # täglich 04:00 UTC (05:00 MEZ / 06:00 MESZ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SVGs bauen
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: sidneyerklaert
        run: python today.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || git commit -m "Profil-Stats aktualisiert"
          git push
